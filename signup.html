<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | Assetto Corsa Accelerator</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#09090b">
<link rel="icon" type="image/png" href="assets/ACA-GT40-favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/ACA-GT40-favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'] } } } };
</script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .logo-blend { mix-blend-mode: screen; } /* drops the logo's black background onto the dark page */
  /* Scrollbar: always reserve the same gutter (no layout shift between pages), but keep the bar invisible until you reach for it */
  html { scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: transparent transparent; }
  html.sb-show { scrollbar-color: #52525b transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: transparent; border-radius: 9999px; }
  html.sb-show ::-webkit-scrollbar-thumb { background: #52525b; }
  html.sb-show ::-webkit-scrollbar-thumb:hover { background: #71717a; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body class="bg-zinc-950 text-zinc-300 antialiased selection:bg-red-600 selection:text-white">

<script src="aca-layout.js" data-slot="header"></script>

<main class="px-5 pt-32 pb-20 sm:pt-40">
  <div class="mx-auto max-w-md">
    <p class="mb-3 font-mono text-xs font-semibold uppercase tracking-widest text-red-500">Driver Profile</p>
    <h1 class="text-3xl font-black tracking-tight text-white sm:text-4xl">Create your account</h1>

    <div id="signup-forms" class="mt-8">
      <form id="signup-form" class="space-y-4" novalidate>
        <div>
          <label for="email" class="mb-1.5 block text-sm font-medium text-zinc-300">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@racing.com" class="w-full rounded-md border border-zinc-800 bg-zinc-900 px-4 py-3.5 text-white placeholder-zinc-500 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-500/30 aria-[invalid=true]:border-red-500">
        </div>
        <div>
          <label for="password" class="mb-1.5 block text-sm font-medium text-zinc-300">Password</label>
          <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" class="w-full rounded-md border border-zinc-800 bg-zinc-900 px-4 py-3.5 text-white placeholder-zinc-500 outline-none transition focus:border-red-500 focus:ring-2 focus:ring-red-500/30 aria-[invalid=true]:border-red-500">
        </div>
        <button type="submit" id="signup-btn" class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-red-600 px-6 py-3.5 font-semibold text-white transition hover:bg-red-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400 disabled:cursor-not-allowed disabled:opacity-70">
          <svg class="spinner hidden h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" class="opacity-25"/><path d="M4 12a8 8 0 018-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          <span class="btn-label">Create Account</span>
        </button>
      </form>

      <div class="my-6 flex items-center gap-4 text-xs font-mono uppercase tracking-widest text-zinc-600">
        <span class="h-px flex-1 bg-zinc-800"></span>or<span class="h-px flex-1 bg-zinc-800"></span>
      </div>

      <button type="button" id="google-btn" class="inline-flex w-full items-center justify-center gap-3 rounded-md border border-zinc-700 bg-zinc-900 px-6 py-3.5 font-semibold text-white transition hover:border-zinc-500 hover:bg-zinc-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400 disabled:cursor-not-allowed disabled:opacity-70">
        <svg class="h-5 w-5" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign up with Google
      </button>

      <p class="mt-8 text-center text-sm text-zinc-400">Already have an account? <a href="/login" class="font-semibold text-red-500 transition-colors hover:text-red-400">Log in</a></p>
    </div>

    <p id="msg" class="mt-4 min-h-[1.25rem] text-sm" role="status" aria-live="polite"></p>
  </div>
</main>

<script src="aca-layout.js" data-slot="footer"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aca-config.js"></script>
<script src="aca-auth.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var msg = document.getElementById('msg');
  function show(text, ok) {
    msg.textContent = text;
    msg.className = 'mt-4 min-h-[1.25rem] text-sm ' + (ok ? 'text-emerald-400' : 'text-red-400');
  }

  var form = document.getElementById('signup-form');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var btn = document.getElementById('signup-btn');
  var googleBtn = document.getElementById('google-btn');
  var re = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  [email, password].forEach(function (el) {
    el.addEventListener('input', function () { el.removeAttribute('aria-invalid'); msg.textContent = ''; });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!ACA.configured) { show('Supabase is not configured yet. Add your project URL and anon key in aca-auth.js.', false); return; }
    if (!re.test(email.value.trim())) {
      email.setAttribute('aria-invalid', 'true'); show('Enter a valid email address.', false); email.focus(); return;
    }
    if (password.value.length < 8) {
      password.setAttribute('aria-invalid', 'true'); show('Password must be at least 8 characters.', false); password.focus(); return;
    }
    btn.disabled = true;
    btn.querySelector('.spinner').classList.remove('hidden');
    btn.querySelector('.btn-label').textContent = 'Creating account…';
    show('', true);

    ACA.sb.auth.signUp({
      email: email.value.trim(),
      password: password.value,
      options: { emailRedirectTo: ACA.url('/dashboard') }
    })
      .then(function (res) {
        if (res.error) throw res.error;
        // If email confirmation is turned off in Supabase, a session comes back immediately.
        if (res.data && res.data.session) { window.location.href = '/dashboard'; return; }
        btn.querySelector('.spinner').classList.add('hidden');
        btn.querySelector('.btn-label').textContent = 'Check your email';
        form.querySelectorAll('input').forEach(function (i) { i.readOnly = true; });
        show('Please check your email for the verification link.', true);
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.querySelector('.spinner').classList.add('hidden');
        btn.querySelector('.btn-label').textContent = 'Create Account';
        show(err && err.message ? err.message : 'Could not create account. Try again.', false);
      });
  });

  googleBtn.addEventListener('click', function () {
    if (!ACA.configured) { show('Supabase is not configured yet. Add your project URL and anon key in aca-auth.js.', false); return; }
    googleBtn.disabled = true;
    ACA.sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: ACA.url('/dashboard') } })
      .then(function (res) { if (res.error) throw res.error; })
      .catch(function (err) { googleBtn.disabled = false; show(err.message || 'Google sign-up failed.', false); });
  });
</script>
</body>
</html>
