<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Assetto Corsa Accelerator</title>
<meta name="theme-color" content="#09090b">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/ACA-GT40-favicon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'] } } } };
</script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  html { scrollbar-gutter: stable; }
</style>
</head>
<body class="bg-zinc-950 text-zinc-300 antialiased selection:bg-red-600 selection:text-white">

<script src="aca-layout.js" data-slot="header"></script>

<main class="px-5 pt-32 pb-20 sm:pt-40">
  <div class="mx-auto max-w-xl">
    <a href="plans.html" class="font-mono text-xs uppercase tracking-widest text-zinc-500 transition-colors hover:text-white">&larr; Back to plans</a>
    <h1 id="title" class="mt-6 text-3xl font-black tracking-tight text-white sm:text-4xl">Checkout</h1>
    <p id="sub" class="mt-3 text-zinc-400"></p>

    <!-- Tandem seat choice: popup that assumes nothing -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 px-5 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="w-full max-w-md rounded-md border border-zinc-800 bg-zinc-950 p-6 shadow-2xl">
        <h2 id="modal-title" class="text-xl font-bold text-white">Who is this Tandem plan for?</h2>
        <p id="modal-sub" class="mt-1 text-sm text-zinc-400"></p>
        <div id="choice" class="mt-5 space-y-3"></div>
        <a href="plans.html" class="mt-5 inline-block font-mono text-xs uppercase tracking-widest text-zinc-500 transition-colors hover:text-white">&larr; Back to plans</a>
      </div>
    </div>

    <!-- Status / errors -->
    <p id="status" class="mt-8 text-sm text-zinc-400" role="status"></p>
  </div>
</main>

<script src="aca-layout.js" data-slot="footer"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="aca-config.js"></script>
<script src="aca-auth.js"></script>
<script>
  /* ============================================================
   * 1. Paste your 3 Stripe Payment Links here.
   *    solo        = Pro, $9.99/mo
   *    tandem-half = Tandem, one seat, $8.99/mo
   *    tandem-full = Tandem, both seats, $17.98/mo (one price at $17.98, or $8.99 with quantity 2)
   * ============================================================ */
  var STRIPE_LINKS = {
    'solo':        'https://buy.stripe.com/7sY8wI9ZvbcX97B4zt2Fa00',
    'tandem-half': 'https://buy.stripe.com/9B64gsfjP2GrgA3ea32Fa02',
    'tandem-full': 'https://buy.stripe.com/9B6aEQ0oV6WH2Jd7LF2Fa01'
  };

  // Keep these in sync with plans.html
  var PRO_PRICE = 9.99, CURRENCY = '$';
  var TANDEM_EACH = Math.round(PRO_PRICE * 0.9 * 100) / 100;
  function money(n) { return CURRENCY + n.toFixed(2); }

  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var plan = params.get('plan');      // 'pro' | 'tandem'
  var seats = params.get('seats');    // optional: '1' | '2' skips the choice screen

  function setStatus(msg, isError) {
    var s = $('status');
    s.textContent = msg;
    s.className = 'mt-8 text-sm ' + (isError ? 'text-red-400' : 'text-zinc-400');
  }

  // Sends the buyer to Stripe, tagged with their account so the webhook knows who paid.
  function go(key) {
    var base = STRIPE_LINKS[key];
    if (!base) { setStatus('That option is not available yet. Go back to the plans page and try again.', true); return; }
    setStatus('Taking you to secure checkout...');
    ACA.ready.then(function (session) {
      if (!session) {
        location.href = '/login';
        return;
      }
      var url = new URL(base);
      url.searchParams.set('client_reference_id', session.user.id);
      if (session.user.email) url.searchParams.set('prefill_email', session.user.email);
      location.replace(url.toString()); // replace, so Back from Stripe returns to plans instead of looping
    }).catch(function () {
      setStatus('Could not verify your sign-in. Refresh the page and try again.', true);
    });
  }

  function option(label, desc, price, key) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'flex w-full items-center justify-between gap-4 rounded-md border border-zinc-800 bg-zinc-900/60 px-5 py-4 text-left transition hover:border-red-500/60 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400';
    b.innerHTML = '<span><span class="block font-semibold text-white"></span><span class="mt-0.5 block text-sm text-zinc-500"></span></span>' +
                  '<span class="shrink-0 font-mono text-sm text-zinc-200"></span>';
    var spans = b.querySelectorAll('span');
    spans[1].textContent = label;
    spans[2].textContent = desc;
    spans[3].textContent = price;
    b.addEventListener('click', function () { go(key); });
    return b;
  }

  if (plan === 'pro') {
    $('title').textContent = 'Get Pro';
    go('solo');
  } else if (plan === 'tandem') {
    $('title').textContent = 'Get Tandem';
    if (seats === '1') go('tandem-half');
    else if (seats === '2') go('tandem-full');
    else {
      var box = $('choice');
      $('modal-sub').textContent = 'Each Tandem seat is ' + money(TANDEM_EACH) + '/mo. Pick how you want to pay.';
      box.appendChild(option('Just me', 'Your partner pays for their own seat', money(TANDEM_EACH) + '/mo', 'tandem-half'));
      box.appendChild(option('Me + my partner', 'Pay for both and gift your partner their seat', money(TANDEM_EACH * 2) + '/mo', 'tandem-full'));
      $('modal').classList.remove('hidden');
      $('modal').classList.add('flex');
      box.firstChild.focus();
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') location.href = 'plans.html'; });
    }
  } else {
    $('sub').textContent = 'No plan selected.';
    setStatus('Pick a plan on the plans page to continue.', true);
  }
</script>
</body>
</html>
